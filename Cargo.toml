[workspace]
resolver = "2"
members = ["crates/shared", "crates/patcher", "crates/dumper"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mmvp-shared = { path = "crates/shared" }
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
