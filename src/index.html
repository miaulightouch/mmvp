<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瑪奇 Mobile 日文語音</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header><h1>瑪奇 Mobile 日文語音</h1><span id="ver" class="muted"></span></header>

  <section id="banner" class="banner" hidden></section>

  <section class="card">
    <div class="row"><div class="label">遊戲目錄</div><div class="value" id="root">—</div><button id="pickRoot" class="ghost">變更…</button></div>
    <div class="row"><div class="label">日文語音</div><div class="value" id="voices">—</div><div></div></div>
    <div class="row"><div class="label">狀態</div><div class="value"><span id="state" class="pill">—</span> <span id="detail" class="muted"></span></div><div></div></div>
  </section>

  <section class="actions">
    <button id="apply" class="primary">套用日文語音</button>
    <button id="restore">還原原版語音</button>
  </section>

  <section class="card" id="progress" hidden>
    <div class="row"><div class="label" id="step">—</div><div class="value muted" id="count"></div><div></div></div>
    <progress id="bar"></progress>
  </section>

  <section class="card log" id="logCard" hidden><ul id="log"></ul></section>
</main>
<script src="main.js"></script>
</body>
</html>
