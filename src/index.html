<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmvp</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- texts come from i18n.js -->
<main>
  <header><h1 data-i18n="title"></h1><span id="ver" class="muted"></span><button id="lang" class="ghost">A/文</button></header>

  <section id="banner" class="banner" hidden></section>

  <section class="card">
    <div class="row"><div class="label" data-i18n="root"></div><div class="value"><span id="root">—</span> <span id="experimental" class="pill reverted" data-i18n="experimental" data-i18n-title="experimentalTip" hidden></span></div><button id="pickRoot" class="ghost" data-i18n="change"></button></div>
    <div class="row"><div class="label" data-i18n="voices"></div><div class="value" id="voices">—</div><div></div></div>
    <div class="row"><div class="label" data-i18n="state"></div><div class="value"><span id="state" class="pill">—</span> <span id="detail" class="muted"></span></div><div></div></div>
  </section>

  <section class="actions">
    <button id="apply" class="primary" data-i18n="apply"></button>
    <button id="restore" data-i18n="restore"></button>
  </section>

  <section class="card" id="progress" hidden>
    <div class="row"><div class="label" id="step">—</div><div class="value muted" id="count"></div><div></div></div>
    <progress id="bar"></progress>
  </section>

  <section class="card log" id="logCard" hidden><ul id="log"></ul></section>
</main>
<script src="i18n.js"></script>
<script src="main.js"></script>
</body>
</html>
