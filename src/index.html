<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmvp</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- texts come from i18n.js -->
<main>
  <header><h1 data-i18n="title"></h1><span id="ver" class="muted"></span><button id="lang" class="ghost"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg></button></header>

  <section id="banner" class="banner" hidden></section>

  <section class="card">
    <div class="row"><div class="label" data-i18n="root"></div><div class="value"><span id="root">—</span> <span id="experimental" class="pill reverted" data-i18n="experimental" data-i18n-title="experimentalTip" hidden></span></div><button id="pickRoot" class="ghost" data-i18n="change"></button></div>
    <div class="row"><div class="label" data-i18n="online"></div><div class="value" id="online">—</div><div></div></div>
    <div class="row"><div class="label" data-i18n="local"></div><div class="value" id="local">—</div><div></div></div>
    <div class="row"><div class="label" data-i18n="state"></div><div class="value"><span id="state" class="pill">—</span></div><div></div></div>
  </section>

  <section class="actions">
    <button id="apply" class="primary" data-i18n="apply"></button>
    <button id="restore" data-i18n="restore"></button>
  </section>

  <section class="card" id="progress" hidden>
    <div class="row"><div class="label" id="step">—</div><div class="value muted" id="count"></div><div></div></div>
    <progress id="bar"></progress>
  </section>

  <section class="card log" id="logCard" hidden><ul id="log"></ul></section>
</main>
<script src="i18n.js"></script>
<script src="main.js"></script>
</body>
</html>
