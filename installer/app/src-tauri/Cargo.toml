[package]
name = "mmvoice-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mmvoice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mmv-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
winreg = "0.55"
ureq = "2"
base64 = "0.22"
minisign-verify = "0.2"
