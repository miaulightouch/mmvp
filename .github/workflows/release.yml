# Build the patcher and publish a GitHub Release with Tauri updater artifacts.
# Trigger: push a tag vX.Y.Z equal to [workspace.package] version in src-tauri/Cargo.toml.
#
# Repository settings (Settings > Secrets and variables > Actions):
#   secrets.TAURI_SIGNING_PRIVATE_KEY, secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD   updater signing key
#   vars.TAURI_UPDATER_PUBKEY                                                       its public key
#   vars.MMVP_SOURCE                                                                voice site URL
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Check tag and configuration
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != src-tauri/Cargo.toml version $version"; exit 1; }
          [ -n "${{ vars.TAURI_UPDATER_PUBKEY }}" ] || { echo "set repository variable TAURI_UPDATER_PUBKEY"; exit 1; }
          [ -n "${{ vars.MMVP_SOURCE }}" ] || { echo "set repository variable MMVP_SOURCE"; exit 1; }
          cat > "$RUNNER_TEMP/updater.json" <<EOF
          {"plugins": {"updater": {"pubkey": "${{ vars.TAURI_UPDATER_PUBKEY }}",
            "endpoints": ["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}
          EOF

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Build and publish the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MMVP_SOURCE: ${{ vars.MMVP_SOURCE }}
          MMVP_REPO: ${{ github.repository }}
        with:
          tauriScript: npx tauri
          args: --config ${{ runner.temp }}/updater.json
          tagName: ${{ github.ref_name }}
          releaseName: "mmvp ${{ github.ref_name }}"
          releaseBody: "`mmvp-portable.exe`：免安裝，直接執行。`*-setup.exe`：安裝版（不需要系統管理員權限）。兩者都會自動提示更新。"
          updaterJsonPreferNsis: true

      - name: Attach the portable exe (same binary, signed for self-update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          p="$RUNNER_TEMP/mmvp-portable.exe"
          cp src-tauri/target/release/mmvp.exe "$p"
          npx tauri signer sign "$p"
          # v0.1.x portable copies update from the old asset name
          cp "$p" "$RUNNER_TEMP/mmvoice-portable.exe"; cp "$p.sig" "$RUNNER_TEMP/mmvoice-portable.exe.sig"
          gh release upload "$GITHUB_REF_NAME" "$p" "$p.sig" "$RUNNER_TEMP/mmvoice-portable.exe" "$RUNNER_TEMP/mmvoice-portable.exe.sig" --clobber
